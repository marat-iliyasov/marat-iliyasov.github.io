short_bio: >-
    <ul>
        <li> A Chechen Scholar of International Relations and Comparative Politics. I focus on Russo-Chechen war and post-war relations; post-Soviet conflicts in wider Eurasia; religious radicalization and governance of religions, authoritarianism and memory politics in Russia and Chechnya.</li>
        &nbsp;
        <li> My journey in the realm of academia commenced in 2013 with the initiation of my Ph.D. program at the University of St Andrews. The profound impact of my previous pursuits, namely my MAs in Caucasus Studies and International Relations, played a pivotal role in shaping my decision to pursue a Ph.D.</li>
        &nbsp;
        <li> Under the expert guidance of Professor Rick Fawn and Dr. Jeffrey Murer, my supervisors, my inherent curiosity was nurtured, transforming me into a passionate and meticulous researcher and educator. My areas of focus encompass political, economic, and social issues within the broader Eurasian context.</li>
        &nbsp;
        <li> Before venturing into the academic realm, from 2003 to 2010, I garnered invaluable experience as a journalist for national newspapers in Lithuania. This role instilled in me the necessary discipline in writing and honed the skills that later aided me in my publications.</li>
        &nbsp;
        <li> Between 2006 and 2008, I served as a member of the renowned think-tank "Center for Strategic Studies" in Lithuania. With a particular focus on analyzing the wider Eurasian region, the Center provided regular consultancy services to the Government and Ministry of Foreign Affairs. Additionally, I had the opportunity to offer my insights to the US State Department regarding the motives behind the Russian invasion of Ukraine in 2022.</li>
        &nbsp;
        <li> Furthermore, I have gained experience working in the NGO sector. Witnessing the onset of the second Russo-Chechen war and the subsequent influx of Chechen refugees to Lithuania in 1999, I took the initiative to establish an NGO. Through this organization, we designed and implemented projects aimed at facilitating the integration of Chechen children into Lithuanian society. My involvement with NGOs continued in Georgia from 2011 to 2013, where I worked at the "Caucasian House" on a project that fostered communication between mid-level Georgian and Russian professionals, laying the groundwork for peace dialogue.</li>
    </ul>

